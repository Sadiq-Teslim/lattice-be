[project]
name = "lattice-trustanchor"
version = "0.1.0"
description = "AI-powered proof-of-life payroll verification engine for Squad Hackathon 3.0."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "torch>=2.10.0",
    "torchvision>=0.26.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.1",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["sdk*", "models*", "tools*", "tests*", "docs*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
