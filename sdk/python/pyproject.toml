[project]
name = "lattice-sdk"
version = "0.1.0"
description = "Python SDK for Lattice proof-of-life payroll verification."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice_sdk"]
